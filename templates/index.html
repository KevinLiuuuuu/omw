<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMW</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel"
       class="hidden fixed top-4 right-4 z-[1000] w-72 rounded-lg bg-white p-4 shadow-lg">
    <button id="panel-close"
            class="absolute top-2 right-3 text-xl leading-none text-gray-400 hover:text-gray-600">&times;</button>
    <h2 id="panel-name" class="pr-4 font-semibold text-gray-900"></h2>
    <p id="panel-kind" class="text-sm capitalize text-gray-500"></p>
    <div class="mt-3 flex items-center gap-2">
      <span id="panel-dot" class="inline-block h-3 w-3 rounded-full"></span>
      <span id="panel-status" class="text-sm font-medium"></span>
    </div>
    <p id="panel-reported" class="mt-1 text-sm text-gray-500"></p>
  </div>

  <script>
    const SYDNEY_CBD = [-33.8688, 151.2093];

    const STATUS_COLORS = {
      available: "#22c55e",
      unavailable: "#ef4444",
      unknown: "#9ca3af",
    };

    const STATUS_LABELS = {
      available: "Available",
      unavailable: "Unavailable",
      unknown: "Unknown",
    };

    // Turn an ISO timestamp into plain English like "20 minutes ago".
    // Returns null if there is no timestamp.
    function timeAgo(iso) {
      if (!iso) return null;
      const seconds = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
      if (seconds < 45) return "just now";

      const units = [
        ["day", 86400],
        ["hour", 3600],
        ["minute", 60],
      ];
      for (const [name, size] of units) {
        const value = Math.floor(seconds / size);
        if (value >= 1) {
          return `${value} ${name}${value === 1 ? "" : "s"} ago`;
        }
      }
      return "just now";
    }

    const map = L.map("map").setView(SYDNEY_CBD, 14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 14),
        () => map.setView(SYDNEY_CBD, 14)
      );
    }

    const panel = document.getElementById("panel");
    document.getElementById("panel-close").addEventListener("click", () => {
      panel.classList.add("hidden");
    });

    function showPanel(res) {
      const status = STATUS_COLORS[res.status] ? res.status : "unknown";
      document.getElementById("panel-name").textContent = res.name;
      document.getElementById("panel-kind").textContent = res.kind;
      document.getElementById("panel-dot").style.backgroundColor = STATUS_COLORS[status];
      const statusEl = document.getElementById("panel-status");
      statusEl.textContent = STATUS_LABELS[status];
      statusEl.style.color = STATUS_COLORS[status];

      const ago = timeAgo(res.last_report);
      const reportedEl = document.getElementById("panel-reported");
      if (!ago) {
        reportedEl.textContent = "No reports yet";
      } else if (status === "available") {
        reportedEl.textContent = `confirmed ${ago}`;
      } else {
        reportedEl.textContent = `reported ${ago}`;
      }

      panel.classList.remove("hidden");
    }

    fetch("/api/resources")
      .then((r) => r.json())
      .then((resources) => {
        resources.forEach((res) => {
          const color = STATUS_COLORS[res.status] || STATUS_COLORS.unknown;
          L.circleMarker([res.lat, res.lng], {
            radius: 9,
            color: "#ffffff",
            weight: 2,
            fillColor: color,
            fillOpacity: 0.9,
          })
            .addTo(map)
            .on("click", () => showPanel(res));
        });
      });
  </script>
</body>
</html>
