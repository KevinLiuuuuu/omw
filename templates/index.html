<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMW</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    /* Map fills the whole viewport; panels float above it. */
    #map { position: fixed; inset: 0; z-index: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Sidebar toggle: always visible, sits above the sidebar. -->
  <button id="sidebar-toggle"
          class="fixed left-4 top-4 z-[1001] rounded-lg bg-white/80 px-3 py-2 text-sm font-medium text-gray-700 shadow-lg backdrop-blur hover:bg-white">
    &#9776; <span id="sidebar-toggle-label">Hide</span>
  </button>

  <!-- Left sidebar: search + filter, then a scrollable list of cards. -->
  <aside id="sidebar"
         class="fixed bottom-4 left-4 top-16 z-[1000] flex w-80 flex-col overflow-hidden rounded-lg bg-white/80 shadow-lg backdrop-blur transition-transform duration-200">
    <div class="space-y-2 border-b border-gray-200/70 p-3">
      <input id="search" type="search" placeholder="Search resources&hellip;"
             class="w-full rounded-md border border-gray-300 bg-white/80 px-3 py-2 text-sm outline-none focus:border-gray-400">
      <select id="filter"
              class="w-full rounded-md border border-gray-300 bg-white/80 px-3 py-2 text-sm outline-none focus:border-gray-400">
        <option value="all">All resources</option>
        <option value="shelter">Shelters</option>
        <option value="pantry">Pantries</option>
        <option value="wifi">Free wifi</option>
      </select>
    </div>
    <div id="card-list" class="flex-1 space-y-2 overflow-y-auto p-3"></div>
  </aside>

  <!-- Detail panel: hidden until a location is selected. -->
  <div id="detail"
       class="hidden fixed right-4 top-4 z-[1000] w-80 rounded-lg bg-white/80 p-4 shadow-lg backdrop-blur">
    <button id="detail-close"
            class="absolute right-3 top-2 text-xl leading-none text-gray-400 hover:text-gray-600">&times;</button>
    <h2 class="pr-4 font-semibold text-gray-900">Location detail</h2>
    <p class="mt-1 text-sm text-gray-500">
      Placeholder &mdash; details for the selected location will appear here.
    </p>
    <p id="detail-ref" class="mt-3 text-xs text-gray-400"></p>
  </div>

  <script>
    const SYDNEY_CBD = [-33.8688, 151.2093];

    const STATUS_COLORS = {
      available: "#22c55e",
      unavailable: "#ef4444",
      unknown: "#9ca3af",
    };

    // Once confidence drops this low we no longer trust the status at all.
    const UNKNOWN_BELOW = 0.2;

    // Colour a marker gets on the map: grey once we can't trust the status.
    function markerColor(res) {
      if (res.confidence != null && res.confidence < UNKNOWN_BELOW) {
        return STATUS_COLORS.unknown;
      }
      return STATUS_COLORS[res.status] || STATUS_COLORS.unknown;
    }

    // Fade a marker as confidence falls, keeping a floor so it stays clickable.
    function markerOpacity(res) {
      const c = res.confidence == null ? 1 : res.confidence;
      return Math.max(0.25, Math.min(0.9, c));
    }

    // Turn an ISO timestamp into plain English like "20 minutes ago".
    // Returns null if there is no timestamp.
    function timeAgo(iso) {
      if (!iso) return null;
      const seconds = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
      if (seconds < 45) return "just now";
      for (const [name, size] of [["day", 86400], ["hour", 3600], ["minute", 60]]) {
        const value = Math.floor(seconds / size);
        if (value >= 1) return `${value} ${name}${value === 1 ? "" : "s"} ago`;
      }
      return "just now";
    }

    // --- Distance + open-hours helpers (map-list shares these) ----------
    const DEG = Math.PI / 180;

    // Great-circle distance between two [lat, lng] points, in kilometres.
    function haversineKm(a, b) {
      const dLat = (b[0] - a[0]) * DEG;
      const dLng = (b[1] - a[1]) * DEG;
      const s =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(a[0] * DEG) * Math.cos(b[0] * DEG) * Math.sin(dLng / 2) ** 2;
      return 2 * 6371 * Math.asin(Math.sqrt(s));
    }

    // Approximate walking time: haversine x 1.4 for street routing, at 5 km/h.
    function walkPhrase(km) {
      const mins = Math.max(1, Math.round((km * 1.4) / 5 * 60));
      if (mins < 60) return `${mins} min walk`;
      return `${Math.floor(mins / 60)}h ${mins % 60}m walk`;
    }

    function toMinutes(hhmm) {
      const [h, m] = hhmm.split(":").map(Number);
      return h * 60 + m;
    }

    // "18:00" -> "6pm", "18:30" -> "6:30pm", "24:00" -> "midnight".
    function clockLabel(hhmm) {
      let [h, m] = hhmm.split(":").map(Number);
      if (h === 24 && m === 0) return "midnight";
      h %= 24;
      const ap = h >= 12 ? "pm" : "am";
      let hr = h % 12;
      if (hr === 0) hr = 12;
      return m ? `${hr}:${String(m).padStart(2, "0")}${ap}` : `${hr}${ap}`;
    }

    // Current Australia/Sydney weekday key + minutes-since-midnight, matching
    // how the API reckons is_open_now.
    function sydneyNow() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Australia/Sydney",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      }).formatToParts(new Date());
      const p = Object.fromEntries(parts.map((x) => [x.type, x.value]));
      return {
        day: p.weekday.toLowerCase(),
        minutes: (parseInt(p.hour, 10) % 24) * 60 + parseInt(p.minute, 10),
      };
    }

    // { text, open } for a resource's card: green "Open until 6pm" vs grey "Closed".
    function openStatus(res) {
      if (res.is_open_now == null) return { text: "Hours unknown", open: false };
      if (!res.is_open_now) return { text: "Closed", open: false };
      const { day, minutes } = sydneyNow();
      const intervals = (res.hours && res.hours[day]) || [];
      for (const [start, end] of intervals) {
        if (toMinutes(start) <= minutes && minutes < toMinutes(end)) {
          if (start === "00:00" && end === "24:00") return { text: "Open 24h", open: true };
          return { text: `Open until ${clockLabel(end)}`, open: true };
        }
      }
      return { text: "Open", open: true };
    }

    // Directions-free Google Maps link straight from the coordinates.
    function mapsUrl(res) {
      return `https://www.google.com/maps/search/?api=1&query=${res.lat},${res.lng}`;
    }

    const map = L.map("map").setView(SYDNEY_CBD, 14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // Distances and sort order are measured from here; defaults to the CBD
    // until geolocation resolves.
    let userLatLng = SYDNEY_CBD;

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLatLng = [pos.coords.latitude, pos.coords.longitude];
          map.setView(userLatLng, 14);
          renderList();
        },
        () => map.setView(SYDNEY_CBD, 14)
      );
    }

    // --- Sidebar collapse -------------------------------------------------
    const sidebar = document.getElementById("sidebar");
    const toggleLabel = document.getElementById("sidebar-toggle-label");
    document.getElementById("sidebar-toggle").addEventListener("click", () => {
      const collapsed = sidebar.classList.toggle("-translate-x-[150%]");
      toggleLabel.textContent = collapsed ? "Show" : "Hide";
    });

    // --- Selection + detail panel --------------------------------------
    const detail = document.getElementById("detail");
    const detailRef = document.getElementById("detail-ref");
    let selectedKey = null;

    function closeDetail() {
      selectedKey = null;
      detail.classList.add("hidden");
      syncCardHighlight();
    }

    // Selecting a new location opens the panel; selecting the current one
    // again dismisses it.
    function selectLocation(key, label) {
      if (selectedKey === key) {
        closeDetail();
        return;
      }
      selectedKey = key;
      detailRef.textContent = label ? `Selected: ${label}` : "";
      detail.classList.remove("hidden");
      syncCardHighlight();
    }

    document.getElementById("detail-close").addEventListener("click", closeDetail);

    function syncCardHighlight() {
      cardList.querySelectorAll("[data-key]").forEach((el) => {
        el.classList.toggle("ring-2", el.dataset.key === selectedKey);
        el.classList.toggle("ring-gray-400", el.dataset.key === selectedKey);
      });
    }

    // --- Sidebar list + map markers, both fed from /api/resources -------
    const cardList = document.getElementById("card-list");
    const searchBox = document.getElementById("search");
    let allResources = [];

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // Build one sidebar card. `res` already carries a `_km` distance.
    function makeCard(res) {
      const key = `res-${res.id}`;
      const status = openStatus(res);
      const ago = timeAgo(res.last_report);
      const cap =
        res.overall_capacity == null
          ? null
          : `${Math.round(res.overall_capacity)}% capacity`;

      const card = document.createElement("div");
      card.dataset.key = key;
      card.className =
        "rounded-md border border-gray-200 bg-white/70 p-3 hover:bg-white cursor-pointer";

      const bits = [];
      bits.push(
        `<p class="text-sm font-medium text-gray-900">${escapeHtml(res.name)}</p>`
      );
      bits.push(
        `<p class="mt-1 text-xs font-medium ${
          status.open ? "text-green-600" : "text-gray-500"
        }">${status.text}</p>`
      );
      const meta = [walkPhrase(res._km)];
      if (cap) meta.push(cap);
      if (ago) meta.push(`updated ${ago}`);
      bits.push(
        `<p class="mt-1 text-xs text-gray-500">${meta.join(" &middot; ")}</p>`
      );
      bits.push(
        `<button type="button" data-maps
                 class="mt-2 inline-block rounded-md border border-gray-300 bg-white px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50">
           Open in Google Maps
         </button>`
      );
      card.innerHTML = bits.join("");

      card.addEventListener("click", (e) => {
        if (e.target.closest("[data-maps]")) {
          window.open(mapsUrl(res), "_blank", "noopener");
          return;
        }
        map.panTo([res.lat, res.lng]);
        selectLocation(key, res.name);
      });
      return card;
    }

    // Re-render the list: filter by the search box, sort by distance.
    function renderList() {
      const term = searchBox.value.trim().toLowerCase();
      const rows = allResources
        .map((res) => ({ ...res, _km: haversineKm(userLatLng, [res.lat, res.lng]) }))
        .filter((res) => res.name.toLowerCase().includes(term))
        .sort((a, b) => a._km - b._km);

      cardList.innerHTML = "";
      if (rows.length === 0) {
        cardList.innerHTML =
          '<p class="p-1 text-xs text-gray-500">No matching resources.</p>';
        return;
      }
      rows.forEach((res) => cardList.appendChild(makeCard(res)));
      syncCardHighlight();
    }

    searchBox.addEventListener("input", renderList);

    fetch("/api/resources")
      .then((r) => r.json())
      .then((resources) => {
        allResources = resources;
        resources.forEach((res) => {
          const marker = L.circleMarker([res.lat, res.lng], {
            radius: 9,
            color: "#ffffff",
            weight: 2,
            fillColor: markerColor(res),
            fillOpacity: markerOpacity(res),
          }).addTo(map);
          marker.on("click", () => selectLocation(`res-${res.id}`, res.name));
        });
        renderList();
      });
  </script>
</body>
</html>
